<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipe Search App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Recipe Search Application</h1>
        <p>Find delicious recipes by ingredient</p>
    </header>
    <section class="search-recipes">
        <h2 class="">Search recipes</h2>
        <form>
            <input type="text"placeholder="Enter ingredient">
            <button type="submit" class="button">Search</button>
        </form>
    </section>
    <section class="Search_result">
        <h2>Search Result</h2>
        <div>
            <p>Search for ingredients to see recipes!</p>
        </div>
    </section>
    <section>
        <h2>Favorite Recipes</h2>
        <div>
            <p>No favorite yet. Add some recipes!</p>
        </div>
    </section>
    <footer>
        <p>Created by LO VACO-2025</p>
    </footer>
</body>
</html>
